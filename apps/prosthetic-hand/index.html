<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prosthetic Hand Visualizer — YOUBIONIC</title>
<meta name="description" content="Interactive 3D bionic hand. Explore 16 degrees of freedom, grip patterns, tendon routing and actuator layout — free, in your browser.">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a0a; --ink:#ffffff; --accent:#EDEBE7;
    --line:rgba(237,235,231,.13);
    --line2:rgba(237,235,231,.26);
    --dim:rgba(237,235,231,.42);
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Helvetica Neue',Helvetica,Inter,system-ui,-apple-system,Arial,sans-serif;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--accent);font-family:var(--sans)}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---------- TOP BAR ---------- */
  .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;
       justify-content:space-between;padding:16px 18px;pointer-events:none;
       background:linear-gradient(180deg,rgba(10,10,10,.85),rgba(10,10,10,0))}
  .brand{font-size:10px;letter-spacing:.42em;font-weight:700;color:var(--accent);opacity:.95}
  .subtitle{font-size:9.5px;letter-spacing:.2em;color:var(--dim);margin-top:6px;font-family:var(--mono)}
  .views{display:flex;gap:6px;pointer-events:auto}
  .vbtn{font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:7px 10px;
        border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.02);
        color:var(--dim);cursor:pointer;transition:.16s}
  .vbtn:hover{border-color:var(--line2);color:var(--accent)}
  .vbtn.on{border-color:var(--accent);color:#0a0a0a;background:var(--accent)}

  /* ---------- SPEC READOUT ---------- */
  .specs{position:fixed;left:18px;top:78px;z-index:15;pointer-events:none;
         font-family:var(--mono);font-size:9px;letter-spacing:.08em}
  .specs div{color:var(--dim);margin-bottom:5px}
  .specs b{color:var(--accent);font-weight:500;margin-left:8px}

  /* ---------- FLOATING JOINT LABEL ---------- */
  #jlabel{position:fixed;left:0;top:0;z-index:18;display:none;pointer-events:none;
          font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#0a0a0a;
          background:var(--accent);padding:4px 8px;border-radius:3px;white-space:nowrap;
          box-shadow:0 4px 18px rgba(0,0,0,.6)}

  /* ---------- BOTTOM PANEL ---------- */
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;
         background:linear-gradient(180deg,rgba(10,10,10,0),rgba(10,10,10,.9) 22%,rgba(10,10,10,.97));
         padding:26px 18px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .plabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;
          color:rgba(237,235,231,.32);margin-bottom:9px}

  .grips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .grips::-webkit-scrollbar{display:none}
  .grip{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
        padding:9px 13px;border:1px solid var(--line);border-radius:3px;
        background:rgba(255,255,255,.02);color:var(--dim);cursor:pointer;transition:.16s;white-space:nowrap}
  .grip:hover{border-color:var(--line2);color:var(--accent)}
  .grip.on{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}

  .lower{display:flex;gap:22px;margin-top:14px;align-items:flex-start}
  .col-manual{flex:1 1 auto;min-width:0}
  .col-modes{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}

  .tabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;padding:6px 9px;
       border:1px solid transparent;border-bottom:1px solid var(--line);
       color:rgba(237,235,231,.35);cursor:pointer;transition:.16s;background:none}
  .tab:hover{color:var(--accent)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}

  .sliders{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 18px}
  .sl{min-width:0}
  .sl .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;
           letter-spacing:.1em;color:rgba(237,235,231,.4);margin-bottom:5px}
  .sl .cap i{font-style:normal;color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;
                    background:none;cursor:pointer;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line2)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:var(--accent);margin-top:-4.5px;transition:transform .12s}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}
  input[type=range]::-moz-range-track{height:1px;background:var(--line2)}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border:none;border-radius:50%;background:var(--accent)}

  .mbtn{font-family:var(--mono);font-size:9px;letter-spacing:.13em;padding:8px 12px;
        border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.02);
        color:var(--dim);cursor:pointer;transition:.16s;white-space:nowrap;min-width:128px;
        display:flex;justify-content:space-between;gap:10px;align-items:center}
  .mbtn:hover{border-color:var(--line2);color:var(--accent)}
  .mbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(237,235,231,.08)}
  .dot{width:5px;height:5px;border-radius:50%;background:rgba(237,235,231,.22);flex:0 0 auto}
  .mbtn.on .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}

  .foot{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);
        display:flex;justify-content:space-between;align-items:center;gap:14px;
        font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:rgba(237,235,231,.3)}
  .foot a{color:var(--accent);text-decoration:none;opacity:.85}

  #hint{position:fixed;left:50%;top:52%;transform:translateX(-50%);
        font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:rgba(237,235,231,.28);
        z-index:10;pointer-events:none;transition:opacity .8s}

  #load{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;
        justify-content:center;flex-direction:column;gap:16px;transition:opacity .5s}
  #load .b{font-size:10px;letter-spacing:.42em;font-weight:700}
  #load .p{width:150px;height:1px;background:var(--line);position:relative;overflow:hidden}
  #load .p i{position:absolute;inset:0;background:var(--accent);transform:translateX(-100%);
             animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{to{transform:translateX(100%)}}

  @media(max-width:820px){
    .specs{display:none}
    .lower{flex-direction:column;gap:12px}
    .col-modes{flex-direction:row;flex-wrap:wrap;width:100%}
    .mbtn{min-width:0;flex:1 1 40%}
    .sliders{grid-template-columns:repeat(2,1fr)}
    .panel{padding:20px 14px 11px}
    .top{padding:12px 14px}
    .subtitle{font-size:8.5px}
    .foot{flex-direction:column;align-items:flex-start;gap:5px}
    #hint{top:44%}
  }
</style>
</head>
<body>

<div id="stage"></div>

<div class="top">
  <div>
    <div class="brand">YOUBIONIC</div>
    <div class="subtitle">PROSTHETIC HAND VISUALIZER / 16 DOF</div>
  </div>
  <div class="views">
    <button class="vbtn on" data-view="hero">3/4</button>
    <button class="vbtn" data-view="dorsal">DORSAL</button>
    <button class="vbtn" data-view="palmar">PALMAR</button>
    <button class="vbtn" data-view="lateral">LATERAL</button>
  </div>
</div>

<div class="specs">
  <div>DOF<b id="s-dof">16</b></div>
  <div>GRIP<b id="s-grip">OPEN</b></div>
  <div>SPAN<b>193 MM</b></div>
</div>

<div id="jlabel"></div>
<div id="hint">DRAG TO ORBIT &nbsp;·&nbsp; SCROLL TO ZOOM</div>

<div class="panel">
  <div class="plabel">GRIP PATTERN LIBRARY</div>
  <div class="grips" id="grips"></div>

  <div class="lower">
    <div class="col-manual">
      <div class="plabel">MANUAL JOINT CONTROL</div>
      <div class="tabs" id="tabs"></div>
      <div class="sliders" id="sliders"></div>
    </div>
    <div class="col-modes">
      <button class="mbtn" id="m-explode">EXPLODE<span class="dot"></span></button>
      <button class="mbtn" id="m-internal">ACTUATORS<span class="dot"></span></button>
      <button class="mbtn" id="m-xray">X-RAY<span class="dot"></span></button>
      <button class="mbtn on" id="m-rotate">AUTO-ORBIT<span class="dot"></span></button>
    </div>
  </div>

  <div class="foot">
    <span>YOUBIONIC · 3D-PRINTABLE BIONICS</span>
    <a href="https://ciccarese.github.io/youbionic/apps/prosthetic-hand/">ciccarese.github.io/youbionic/apps/prosthetic-hand/</a>
  </div>
</div>

<div id="load"><div class="b">YOUBIONIC</div><div class="p"><i></i></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   YOUBIONIC — PROSTHETIC HAND VISUALIZER
   Anatomically proportioned right hand, tendon-driven bionic
   architecture. All geometry procedurally generated in code.
   Scale: 1 unit = 1 cm
   ============================================================ */

var stage = document.getElementById('stage');
var W = window.innerWidth, H = window.innerHeight;

/* ---------- RENDERER ---------- */
var renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
stage.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 48, 100);

var camera = new THREE.PerspectiveCamera(36, W/H, 0.5, 300);

/* ---------- PROCEDURAL STUDIO ENVIRONMENT ---------- */
function buildEnvTexture(){
  var c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0,0,0,256);
  g.addColorStop(0.00,'#c9d0d6');
  g.addColorStop(0.36,'#6d757c');
  g.addColorStop(0.55,'#2a2d31');
  g.addColorStop(1.00,'#0c0d0e');
  x.fillStyle = g; x.fillRect(0,0,512,256);
  function box(cx,cy,rx,ry,a){
    var m = Math.max(rx,ry);
    var rg = x.createRadialGradient(cx,cy,0,cx,cy,m);
    rg.addColorStop(0,'rgba(255,255,255,'+a+')');
    rg.addColorStop(1,'rgba(255,255,255,0)');
    x.save();
    x.translate(cx,cy); x.scale(rx/m, ry/m); x.translate(-cx,-cy);
    x.fillStyle = rg;
    x.fillRect(cx-m*1.7, cy-m*1.7, m*3.4, m*3.4);
    x.restore();
  }
  box(120, 52, 132, 62, 0.95);
  box(392, 74, 100, 48, 0.55);
  box(268, 28, 70, 30, 0.40);
  var t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
var pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
var envMap = pmrem.fromEquirectangular(buildEnvTexture()).texture;
scene.environment = envMap;

/* ---------- LIGHTS ---------- */
scene.add(new THREE.HemisphereLight(0x4a5158, 0x08090a, 0.42));

var key = new THREE.DirectionalLight(0xffffff, 2.15);
key.position.set(14, 26, 17);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 6;
key.shadow.camera.far = 80;
key.shadow.camera.left = -20; key.shadow.camera.right = 20;
key.shadow.camera.top = 28;   key.shadow.camera.bottom = -16;
key.shadow.bias = -0.0009;
key.shadow.radius = 3;
scene.add(key);

var fill = new THREE.DirectionalLight(0xc4d2de, 0.50);
fill.position.set(-20, 9, 13); scene.add(fill);

var rim = new THREE.DirectionalLight(0xffffff, 1.50);
rim.position.set(-9, 12, -20); scene.add(rim);

var rim2 = new THREE.DirectionalLight(0x9fb0bd, 0.75);
rim2.position.set(17, 3, -14); scene.add(rim2);

/* ---------- MATERIALS ---------- */
var MAT = {
  shell:  new THREE.MeshStandardMaterial({color:0xe4e2de, roughness:0.46, metalness:0.06, envMapIntensity:1.0}),
  shell2: new THREE.MeshStandardMaterial({color:0xcfcdc9, roughness:0.54, metalness:0.05, envMapIntensity:0.9}),
  dark:   new THREE.MeshStandardMaterial({color:0x191b1e, roughness:0.44, metalness:0.42, envMapIntensity:1.1}),
  metal:  new THREE.MeshStandardMaterial({color:0xa8b0b8, roughness:0.26, metalness:0.98, envMapIntensity:1.4}),
  pin:    new THREE.MeshStandardMaterial({color:0xd6dade, roughness:0.11, metalness:1.00, envMapIntensity:1.9}),
  cable:  new THREE.MeshStandardMaterial({color:0x7d858d, roughness:0.30, metalness:0.92, envMapIntensity:1.4}),
  servo:  new THREE.MeshStandardMaterial({color:0x101214, roughness:0.38, metalness:0.50, envMapIntensity:1.1}),
  pad:    new THREE.MeshStandardMaterial({color:0x24272b, roughness:0.86, metalness:0.02, envMapIntensity:0.5})
};
var SHELLS = [MAT.shell, MAT.shell2, MAT.dark];

/* ---------- GEOMETRY HELPERS ---------- */
var BEV = 0.10;

function extrudeShape(shape, thickness, curveSeg){
  var d = Math.max(0.02, thickness - BEV*2);
  var g = new THREE.ExtrudeGeometry(shape, {
    depth:d, bevelEnabled:true, bevelSize:BEV, bevelThickness:BEV,
    bevelSegments:2, bevelOffset:0, curveSegments:curveSeg||8, steps:1
  });
  g.translate(0, 0, -d/2);
  g.computeVertexNormals();
  return g;
}

/* tapered rounded profile — base at y=0, tip at y=h */
function taperShape(wb, wt, h, r){
  var b = wb/2, t = wt/2;
  r = Math.min(r, b*0.85, t*0.85, h*0.32);
  var s = new THREE.Shape();
  s.moveTo(-b+r, 0);
  s.lineTo(b-r, 0);
  s.quadraticCurveTo(b, 0, b, r);
  s.lineTo(t, h-r);
  s.quadraticCurveTo(t, h, t-r, h);
  s.lineTo(-t+r, h);
  s.quadraticCurveTo(-t, h, -t, h-r);
  s.lineTo(-b, r);
  s.quadraticCurveTo(-b, 0, -b+r, 0);
  return s;
}

function roundedRect(w, h, r){
  var x = -w/2, y = -h/2;
  r = Math.min(r, w/2, h/2);
  var s = new THREE.Shape();
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y);
  s.quadraticCurveTo(x+w, y, x+w, y+r);
  s.lineTo(x+w, y+h-r);
  s.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  s.lineTo(x+r, y+h);
  s.quadraticCurveTo(x, y+h, x, y+h-r);
  s.lineTo(x, y+r);
  s.quadraticCurveTo(x, y, x+r, y);
  return s;
}

function rbox(w, h, d, r, mat){
  var m = new THREE.Mesh(extrudeShape(roundedRect(w,h,r), d, 6), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function xcyl(r, len, mat, seg){
  var g = new THREE.CylinderGeometry(r, r, len, seg||18);
  g.rotateZ(Math.PI/2);
  var m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function ycyl(rt, rb, len, mat, seg){
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, len, seg||20), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ---------- EXPLODE / INTERNALS REGISTRY ---------- */
var explodables = [];
function reg(mesh, dx, dy, dz){
  explodables.push({m:mesh, b:mesh.position.clone(), d:new THREE.Vector3(dx,dy,dz)});
  return mesh;
}
var internals = [];

/* ============================================================
   PHALANX
   local frame: joint at origin, extends along +Y
   palmar side = +Z, dorsal side = -Z
   ============================================================ */
function phalanx(len, wb, wt, th, isTip){
  var g = new THREE.Group();

  /* knuckle barrel */
  g.add(xcyl(th*0.50, wb*1.02, MAT.dark, 20));

  /* polished axle pin */
  var pn = xcyl(th*0.155, wb*1.30, MAT.pin, 14);
  g.add(pn); reg(pn, wb*0.9, 0, 0);

  /* printed shell */
  var y0 = th*0.30;
  var sh = new THREE.Mesh(
    extrudeShape(taperShape(wb, wt, len - y0, Math.min(wt,wb)*0.30), th, 10),
    MAT.shell
  );
  sh.position.y = y0;
  sh.castShadow = true; sh.receiveShadow = true;
  g.add(sh);

  /* dorsal reinforcement ribs */
  var ribL = (len - y0) * 0.62;
  for(var i=-1; i<=1; i+=2){
    var rb = rbox(wt*0.17, ribL, 0.16, 0.06, MAT.dark);
    rb.position.set(i*wt*0.26, y0 + ribL*0.5 + 0.12, -th*0.46);
    g.add(rb); reg(rb, 0, 0, -1.3);
  }

  /* dorsal metal inlay */
  var win = rbox(wt*0.30, ribL*0.55, 0.13, 0.09, MAT.metal);
  win.position.set(0, y0 + ribL*0.42, -th*0.47);
  g.add(win); reg(win, 0, 0, -2.1);

  /* palmar flexor cable */
  var cab = ycyl(0.085, 0.085, len*0.80, MAT.cable, 8);
  cab.position.set(0, y0 + len*0.40, th*0.44);
  cab.visible = false;
  g.add(cab); internals.push(cab); reg(cab, 0, 0, 1.5);

  /* pulley at joint */
  var pul = xcyl(th*0.24, wb*0.42, MAT.metal, 14);
  pul.position.set(0, 0, th*0.30);
  pul.visible = false;
  g.add(pul); internals.push(pul);

  /* fingertip */
  if(isTip){
    var pad = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), MAT.pad);
    pad.scale.set(wt*0.40, len*0.30, th*0.30);
    pad.position.set(0, len*0.72, th*0.30);
    pad.castShadow = true;
    g.add(pad); reg(pad, 0, 0, 1.2);

    var cap = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), MAT.shell);
    cap.scale.set(wt*0.48, wt*0.42, th*0.44);
    cap.position.y = len - wt*0.30;
    cap.castShadow = true;
    g.add(cap);
  }
  return g;
}

/* ============================================================
   HAND ASSEMBLY
   ============================================================ */
var hand = new THREE.Group();
scene.add(hand);

/* palm outline — right hand, thumb on -X, palm faces +Z */
function palmShape(){
  var s = new THREE.Shape();
  s.moveTo(-2.70, 0.55);
  s.quadraticCurveTo(-3.45, 1.25, -3.92, 3.05);
  s.quadraticCurveTo(-4.16, 5.30, -3.74, 7.15);
  s.quadraticCurveTo(-3.62, 8.05, -3.34, 8.62);
  s.quadraticCurveTo(-2.55, 9.20, -1.74, 8.78);
  s.quadraticCurveTo(-0.85, 9.34,  0.02, 8.80);
  s.quadraticCurveTo( 0.85, 9.12,  1.66, 8.58);
  s.quadraticCurveTo( 2.45, 8.44,  3.14, 7.86);
  s.quadraticCurveTo( 3.72, 7.00,  3.58, 5.45);
  s.quadraticCurveTo( 3.46, 3.15,  3.02, 1.45);
  s.quadraticCurveTo( 2.78, 0.42,  1.98, 0.22);
  s.quadraticCurveTo( 0.00,-0.28, -1.98, 0.18);
  s.quadraticCurveTo(-2.46, 0.28, -2.70, 0.55);
  return s;
}

var PALM_T = 2.55;
var palm = new THREE.Group();
hand.add(palm);

var palmShell = new THREE.Mesh(extrudeShape(palmShape(), PALM_T, 14), MAT.shell);
palmShell.castShadow = true; palmShell.receiveShadow = true;
palm.add(palmShell);

/* thenar / hypothenar / arches — this is what makes it read as a hand */
function bulge(sx, sy, sz, px, py, pz){
  var m = new THREE.Mesh(new THREE.SphereGeometry(1, 26, 18), MAT.shell);
  m.scale.set(sx, sy, sz); m.position.set(px, py, pz);
  m.castShadow = true; m.receiveShadow = true;
  palm.add(m); return m;
}
bulge(1.52, 2.75, 1.02, -2.42, 3.05, 0.86);
bulge(1.16, 2.45, 0.86,  2.42, 2.95, 0.80);
bulge(2.85, 1.75, 0.72,  0.00, 6.55, 0.86);
bulge(2.30, 2.00, 0.62,  0.00, 3.40, 0.70);

/* dorsal carrier plate */
var dors = new THREE.Mesh(extrudeShape(palmShape(), 0.34, 12), MAT.dark);
dors.scale.set(0.855, 0.855, 1);
dors.position.set(0.06, 0.72, -PALM_T*0.5 - 0.02);
dors.castShadow = true;
palm.add(dors); reg(dors, 0, 0, -4.0);

function setGrip(name){
  for(var i=0;i<GRIPS.length;i++){
    if(GRIPS[i][0] !== name) continue;
    var p = GRIPS[i][1];

      tgt[FINGERS[k].id] = p[FINGERS[k].id].slice();
    }
    tgt.thumb = p.thumb.slice();
    tgt.spread = p.spread;

  for(var b=0;b<bs.length;b++) bs[b].classList.toggle('on', bs[b].textContent === name);

var D2R = Math.PI/180;

function applyPose(){
  for(var i=0;i<FINGERS.length;i++){
    var f = FINGERS[i], j = joints[f.id], v = cur[f.id];
    j[0].rotation.x = v[0]*D2R;
    j[0].rotation.z = f.base + cur.spread*D2R*f.fan;
    j[1].rotation.x = v[1]*D2R;
    j[2].rotation.x = v[2]*D2R;
  }
  var t = cur.thumb;
  tCMC.rotation.y = -t[0]*D2R;
  tCMC.rotation.x =  t[1]*D2R;
  tMCP.rotation.x =  t[2]*D2R;
  tIP.rotation.x  =  t[3]*D2R;
}

function tabDef(){
  for(var i=0;i<TABS.length;i++) if(TABS[i].id===activeTab) return TABS[i];
  return TABS[1];
}
function readVal(tabId, idx, k){
  if(k === 'spread') return cur.spread;
  if(tabId === 'thumb') return cur.thumb[idx];
  return cur[tabId][idx];
}
function writeVal(tabId, idx, k, v){
  if(k === 'spread'){ tgt.spread = v; return; }
  if(tabId === 'thumb'){ tgt.thumb[idx] = v; return; }
  tgt[tabId][idx] = v;
}
function jointObj(tabId, idx, k){
  if(tabId === 'thumb') return [tCMC, tCMC, tMCP, tIP][idx] || tCMC;
  if(k === 'spread') return joints[tabId][0];
  return joints[tabId][idx];
}

function buildSliders(){
  slidersEl.innerHTML = '';
  sliderRefs = [];
  var t = tabDef();
  for(var i=0;i<t.keys.length;i++){
    (function(kd, idx){
      var lim = LIM[kd[1]];
      var wrap = document.createElement('div');
      wrap.className = 'sl';
      var cap = document.createElement('div');
      cap.className = 'cap';
      var nm = document.createElement('span'); nm.textContent = kd[0];
      var vv = document.createElement('i');
      cap.appendChild(nm); cap.appendChild(vv);
      var inp = document.createElement('input');
      inp.type = 'range'; inp.min = lim[0]; inp.max = lim[1]; inp.step = 1;
      inp.value = Math.round(readVal(t.id, idx, kd[1]));
      vv.textContent = inp.value + '°';
      inp.addEventListener('input', function(){
        var v = parseFloat(inp.value);
        writeVal(t.id, idx, kd[1], v);
        vv.textContent = Math.round(v) + '°';
        showLabel(jointObj(t.id, idx, kd[1]), kd[0], v);
        clearGripHighlight();
      });
      wrap.appendChild(cap); wrap.appendChild(inp);
      slidersEl.appendChild(wrap);
      sliderRefs.push({inp:inp, out:vv, tab:t.id, idx:idx, key:kd[1]});
    })(t.keys[i], i);
  }
}
function syncSliders(){
  for(var i=0;i<sliderRefs.length;i++){
    var s = sliderRefs[i];
    var v = Math.round(readVal(s.tab, s.idx, s.key));
    s.inp.value = v;
    s.out.textContent = v + '°';
  }
}

   ============================================================ */
var explodeT = 0;
var _tmp = new THREE.Vector3();
var last = performance.now();

function tick(now){
  requestAnimationFrame(tick);
  var dt = Math.min(0.05, (now - last)/1000);
  last = now;

  var k = 1 - Math.exp(-dt*9.5);
  for(var i=0;i<FINGERS.length;i++){
    var id = FINGERS[i].id;
    for(var j=0;j<3;j++) cur[id][j] += (tgt[id][j]-cur[id][j])*k;
  }
  for(var t=0;t<4;t++) cur.thumb[t] += (tgt.thumb[t]-cur.thumb[t])*k;
  cur.spread += (tgt.spread-cur.spread)*k;
  applyPose();

  var et = modes.explode ? 1 : 0;
  var prev = explodeT;
  explodeT += (et - explodeT) * (1 - Math.exp(-dt*6.5));
  if(Math.abs(explodeT - prev) > 0.00002 || explodeT > 0.0001){
    for(var e=0;e<explodables.length;e++){
      var ex = explodables[e];
      _tmp.copy(ex.d).multiplyScalar(explodeT);
      ex.m.position.copy(ex.b).add(_tmp);
    }
  }

  if(modes.rotate) cam.tAz -= dt*0.20;

  cam.az += (cam.tAz-cam.az)*(1-Math.exp(-dt*7));
  cam.el += (cam.tEl-cam.el)*(1-Math.exp(-dt*7));
  cam.r  += (cam.tR -cam.r )*(1-Math.exp(-dt*7));

  var ce = Math.cos(cam.el);
  camera.position.set(
    Math.sin(cam.az)*ce*cam.r,
    Math.sin(cam.el)*cam.r + TARGET.y,
    Math.cos(cam.az)*ce*cam.r
  );
  camera.lookAt(TARGET);

  updateLabel();
  renderer.render(scene, camera);
}

function onResize(){
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W/H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
}
window.addEventListener('resize', onResize);
if(window.ResizeObserver) new ResizeObserver(onResize).observe(stage);

/* ---------- BOOT ---------- */
setGrip('REST');
for(var bf=0; bf<FINGERS.length; bf++){
  cur[FINGERS[bf].id] = tgt[FINGERS[bf].id].slice();
}
cur.thumb = tgt.thumb.slice();
cur.spread = tgt.spread;
applyPose();
refreshXray();
requestAnimationFrame(tick);

setTimeout(function(){
  var l = document.getElementById('load');
  l.style.opacity = 0;
  setTimeout(function(){ l.style.display = 'none'; }, 520);
  setTimeout(function(){ setGrip('OPEN'); }, 420);
}, 500);

setTimeout(function(){
  var h = document.getElementById('hint');
  if(h) h.style.opacity = 0;
}, 7000);

})();
</script>
</body>
