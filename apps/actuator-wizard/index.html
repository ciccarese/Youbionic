<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Actuator Selection Wizard — YOUBIONIC</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; color:#fff; font-family:'Courier New',monospace; overflow:hidden; }
#c { position:fixed; top:0; left:0; width:100%; height:100%; display:block; touch-action:none; }

#label { position:fixed; top:16px; left:18px; z-index:10; pointer-events:none; }
.brand { font-size:8px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.28); margin-bottom:4px; }
.title { font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#EDEBE7; line-height:1.3; }

#hint { position:fixed; bottom:252px; right:16px; font-size:8px; letter-spacing:1px;
  text-transform:uppercase; color:rgba(255,255,255,0.18); z-index:10; pointer-events:none; }

#panel {
  position:fixed; bottom:0; left:0; right:0; height:244px;
  background:rgba(7,7,10,0.96);
  border-top:1px solid rgba(237,235,231,0.1);
  backdrop-filter:blur(20px);
  z-index:10; padding:11px 16px 10px;
  display:flex; flex-direction:column; gap:7px;
}

.tabs { display:flex; gap:5px; flex-shrink:0; }
.tab {
  flex:1; padding:7px 4px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(237,235,231,0.1);
  color:rgba(255,255,255,0.38);
  font-family:'Courier New',monospace;
  font-size:8.5px; letter-spacing:0.8px;
  text-transform:uppercase; cursor:pointer;
  transition:all .18s; text-align:center;
}
.tab:hover { color:#EDEBE7; border-color:rgba(237,235,231,0.32); }
.tab.active { background:rgba(237,235,231,0.09); color:#EDEBE7; border-color:rgba(237,235,231,0.7); }

.sliders { display:flex; gap:10px; flex-shrink:0; }
.sg { flex:1; }
.sl { display:flex; justify-content:space-between; align-items:baseline;
  font-size:7.5px; letter-spacing:0.8px; text-transform:uppercase;
  color:rgba(255,255,255,0.32); margin-bottom:4px; }
.sl b { color:#EDEBE7; font-weight:normal; }
input[type=range] {
  width:100%; height:2px; -webkit-appearance:none;
  background:rgba(237,235,231,0.1); outline:none; cursor:pointer; border-radius:1px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:11px; height:11px;
  background:#EDEBE7; border-radius:50%;
}

.metrics { display:flex; gap:5px; flex-shrink:0; }
.mc {
  flex:1; background:rgba(255,255,255,0.025);
  border:1px solid rgba(237,235,231,0.06); padding:5px 8px;
}
.mn { font-size:7px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.28); margin-bottom:2px; }
.mv { font-size:14px; color:#EDEBE7; line-height:1; }
.mu { font-size:7px; color:rgba(255,255,255,0.28); }

.rec {
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(237,235,231,0.03);
  border-left:2px solid rgba(237,235,231,0.45);
  padding:5px 9px; flex-shrink:0;
}
.rl { font-size:7.5px; letter-spacing:0.8px; text-transform:uppercase; color:rgba(255,255,255,0.32); }
.rv { font-size:8px; letter-spacing:0.8px; text-transform:uppercase; color:#EDEBE7; font-weight:bold; max-width:70%; text-align:right; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="label">
  <div class="brand">YOUBIONIC</div>
  <div class="title">Actuator<br>Selection Wizard</div>
</div>
<div id="hint">Drag · Scroll to explore</div>

<div id="panel">
  <div class="tabs">
    <button class="tab active" onclick="setType(0)">Pneumatic Cylinder</button>
    <button class="tab" onclick="setType(1)">Ball Screw Drive</button>
    <button class="tab" onclick="setType(2)">Rack &amp; Pinion</button>
  </div>

  <div class="sliders">
    <div class="sg">
      <div class="sl">Load <b id="lv">100</b> kg</div>
      <input type="range" id="sl-load" min="1" max="500" value="100">
    </div>
    <div class="sg">
      <div class="sl">Speed <b id="sv">100</b> mm/s</div>
      <input type="range" id="sl-speed" min="5" max="500" value="100">
    </div>
    <div class="sg">
      <div class="sl">Stroke <b id="stv">300</b> mm</div>
      <input type="range" id="sl-stroke" min="50" max="1000" value="300">
    </div>
  </div>

  <div class="metrics">
    <div class="mc">
      <div class="mn">Force</div>
      <div class="mv"><span id="mf">981</span><span class="mu"> N</span></div>
    </div>
    <div class="mc">
      <div class="mn">Efficiency</div>
      <div class="mv"><span id="me">78</span><span class="mu"> %</span></div>
    </div>
    <div class="mc">
      <div class="mn">Precision</div>
      <div class="mv"><span id="mp">0.5</span><span class="mu"> mm</span></div>
    </div>
    <div class="mc">
      <div class="mn">Cost Index</div>
      <div class="mv"><span id="mc2">4.2</span><span class="mu"> /10</span></div>
    </div>
  </div>

  <div class="rec">
    <span class="rl">Best match —</span>
    <span class="rv" id="rec">Pneumatic — optimal for high-speed light loads</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* =====================================================
   RENDERER, SCENE, CAMERA
===================================================== */
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.FogExp2(0x07070a, 0.045);

var camera = new THREE.PerspectiveCamera(44, 1, 0.1, 100);

/* =====================================================
   ORBIT CONTROLS (custom)
===================================================== */
var sph = { theta: 0.55, phi: 1.18, radius: 8.5 };
var orbitTarget = new THREE.Vector3(0, 0.3, 0);
var dragging = false;
var prevX = 0, prevY = 0;

function updateCam() {
  camera.position.x = orbitTarget.x + sph.radius * Math.sin(sph.phi) * Math.sin(sph.theta);
  camera.position.y = orbitTarget.y + sph.radius * Math.cos(sph.phi);
  camera.position.z = orbitTarget.z + sph.radius * Math.sin(sph.phi) * Math.cos(sph.theta);
  camera.lookAt(orbitTarget);
}

canvas.addEventListener('mousedown', function(e) { dragging = true; prevX = e.clientX; prevY = e.clientY; e.preventDefault(); });
window.addEventListener('mouseup', function() { dragging = false; });
window.addEventListener('mousemove', function(e) {
  if (!dragging) return;
  sph.theta -= (e.clientX - prevX) * 0.0038;
  sph.phi = Math.max(0.12, Math.min(Math.PI * 0.88, sph.phi + (e.clientY - prevY) * 0.0038));
  prevX = e.clientX; prevY = e.clientY;
  updateCam();
});
canvas.addEventListener('wheel', function(e) {
  sph.radius = Math.max(3.5, Math.min(18, sph.radius + e.deltaY * 0.012));
  updateCam();
}, { passive: true });

var prevTouch = null;
canvas.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) { prevTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
}, { passive: true });
canvas.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1 && prevTouch) {
    sph.theta -= (e.touches[0].clientX - prevTouch.x) * 0.0038;
    sph.phi = Math.max(0.12, Math.min(Math.PI * 0.88, sph.phi + (e.touches[0].clientY - prevTouch.y) * 0.0038));
    prevTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    updateCam();
  }
}, { passive: true });
canvas.addEventListener('touchend', function() { prevTouch = null; }, { passive: true });

/* =====================================================
   ENVIRONMENT MAP
===================================================== */
var envMap = (function() {
  var pmrem = new THREE.PMREMGenerator(renderer);
  var sz = 128;
  var cv = document.createElement('canvas');
  cv.width = sz * 4; cv.height = sz * 2;
  var ctx = cv.getContext('2d');

  var grd = ctx.createRadialGradient(sz * 2, sz, sz * 0.05, sz * 2, sz, sz * 3);
  grd.addColorStop(0, '#505868');
  grd.addColorStop(0.3, '#1e2030');
  grd.addColorStop(1, '#030408');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, sz * 4, sz * 2);

  ctx.fillStyle = 'rgba(180, 195, 240, 0.30)';
  ctx.fillRect(0, 0, sz * 1.1, sz * 2);

  ctx.fillStyle = 'rgba(70, 90, 180, 0.14)';
  ctx.fillRect(sz * 3, 0, sz, sz * 2);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
  ctx.fillRect(sz, 0, sz * 2, sz * 0.22);

  var tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  var result = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose();
  tex.dispose();
  return result;
}());

scene.environment = envMap;

/* =====================================================
   LIGHTING (3-point)
===================================================== */
scene.add(new THREE.AmbientLight(0x202232, 0.9));

var keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(5, 9, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 24;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0006;
scene.add(keyLight);

var fillLight = new THREE.DirectionalLight(0x3048b0, 0.50);
fillLight.position.set(-5, 3, -4);
scene.add(fillLight);

var rimLight = new THREE.DirectionalLight(0xffffff, 0.48);
rimLight.position.set(0, 5, -7);
scene.add(rimLight);

/* =====================================================
   SHARED MATERIALS
===================================================== */
function mkMat(col, metal, rough) {
  return new THREE.MeshStandardMaterial({
    color: col, metalness: metal, roughness: rough,
    envMap: envMap, envMapIntensity: 1.7
  });
}

var mSteel  = mkMat(0x8898aa, 0.95, 0.10);
var mAlum   = mkMat(0xaab2be, 0.85, 0.20);
var mDark   = mkMat(0x252838, 0.90, 0.28);
var mBolt   = mkMat(0x505a68, 0.92, 0.18);
var mRubber = mkMat(0x101018, 0.02, 0.92);
var mBrass  = mkMat(0xb09030, 0.88, 0.22);
var mMotor  = mkMat(0x161626, 0.45, 0.75);
var mRail   = mkMat(0x78818e, 0.92, 0.07);

/* =====================================================
   GROUND
===================================================== */
var shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(22, 22),
  new THREE.ShadowMaterial({ opacity: 0.30 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -2.3;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

var grid = new THREE.GridHelper(14, 30, 0x191922, 0x111118);
grid.position.y = -2.3;
scene.add(grid);

/* =====================================================
   UTILITY: castShadow on all children
===================================================== */
function cr(obj) {
  obj.traverse(function(c) {
    if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
  });
  return obj;
}

/* =====================================================
   RAIL GUIDE SYSTEM (shared)
===================================================== */
function buildRailSystem(len) {
  var g = new THREE.Group();

  // Base plate
  var base = new THREE.Mesh(new THREE.BoxGeometry(len, 0.07, 1.05), mDark);
  g.add(base);

  // Two profiled linear rails
  var zPos = [-0.38, 0.38];
  for (var ri = 0; ri < 2; ri++) {
    var z = zPos[ri];
    var rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.09, 0.07), mRail);
    rail.position.set(0, 0.08, z);
    g.add(rail);
    // Center runner ridge
    var ridge = new THREE.Mesh(new THREE.BoxGeometry(len, 0.055, 0.026), mSteel);
    ridge.position.set(0, 0.135, z);
    g.add(ridge);
    // End stops
    var ends = [-len * 0.5, len * 0.5];
    for (var ei = 0; ei < 2; ei++) {
      var stop = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.11, 0.09), mDark);
      stop.position.set(ends[ei], 0.08, z);
      g.add(stop);
    }
  }

  // Mounting bolts on base
  var bxArr = [-len * 0.5 + 0.22, 0, len * 0.5 - 0.22];
  for (var bxi = 0; bxi < bxArr.length; bxi++) {
    for (var bzi = 0; bzi < 2; bzi++) {
      var bt = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.09, 6), mBolt);
      bt.position.set(bxArr[bxi], 0.02, zPos[bzi]);
      g.add(bt);
    }
  }

  return g;
}

/* =====================================================
   CARRIAGE BLOCK (slides on rails)
===================================================== */
function buildCarriage() {
  var g = new THREE.Group();
  var body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.13, 0.85), mDark);
  g.add(body);
  // Guide channels
  var chZ = [-0.37, 0.37];
  for (var ci = 0; ci < 2; ci++) {
    var ch = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.1, 0.075), mkMat(0x30303e, 0.82, 0.22));
    ch.position.set(0, -0.05, chZ[ci]);
    g.add(ch);
  }
  // 4 top bolts
  var boltPos = [[-0.18, 0.28], [0.18, 0.28], [0.18, -0.28], [-0.18, -0.28]];
  for (var bi = 0; bi < 4; bi++) {
    var bb = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.1, 6), mBolt);
    bb.position.set(boltPos[bi][0], 0.07, boltPos[bi][1]);
    g.add(bb);
  }
  return g;
}

/* =====================================================
   MODEL 1: PNEUMATIC CYLINDER
===================================================== */
var pneumGroup = new THREE.Group();

// Main barrel
var pBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 3.2, 32), mAlum);
pBarrel.rotation.z = Math.PI / 2;
pneumGroup.add(pBarrel);

// 4 tie rods at corners
var tRodPos = [[0.19, 0.19], [0.19, -0.19], [-0.19, 0.19], [-0.19, -0.19]];
for (var tri = 0; tri < 4; tri++) {
  var yr = tRodPos[tri][0], zr = tRodPos[tri][1];
  var trod = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 3.55, 8), mDark);
  trod.rotation.z = Math.PI / 2;
  trod.position.set(0, yr, zr);
  pneumGroup.add(trod);
  // Tie rod nuts at each end
  var nEnds = [-1.72, 1.72];
  for (var nei = 0; nei < 2; nei++) {
    var tnut = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.048, 0.07, 6), mBolt);
    tnut.rotation.z = Math.PI / 2;
    tnut.position.set(nEnds[nei], yr, zr);
    pneumGroup.add(tnut);
  }
}

// Front end cap
var fCap = new THREE.Mesh(new THREE.CylinderGeometry(0.265, 0.265, 0.13, 8), mDark);
fCap.rotation.z = Math.PI / 2;
fCap.position.x = 1.67;
pneumGroup.add(fCap);

// Front guide collar
var fGuide = new THREE.Mesh(new THREE.CylinderGeometry(0.142, 0.142, 0.22, 16), mAlum);
fGuide.rotation.z = Math.PI / 2;
fGuide.position.x = 1.74;
pneumGroup.add(fGuide);

// Seal ring (rubber)
var sealRing = new THREE.Mesh(new THREE.TorusGeometry(0.115, 0.028, 8, 20), mRubber);
sealRing.position.x = 1.6;
pneumGroup.add(sealRing);

// Rear end cap
var rCap = new THREE.Mesh(new THREE.CylinderGeometry(0.265, 0.265, 0.13, 8), mDark);
rCap.rotation.z = Math.PI / 2;
rCap.position.x = -1.67;
pneumGroup.add(rCap);

// Rear mount clevis
var rmBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.36, 0.1), mDark);
rmBody.position.x = -1.77;
pneumGroup.add(rmBody);
var rmPin = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.22, 10), mSteel);
rmPin.position.set(-1.77, 0.18, 0);
pneumGroup.add(rmPin);
// Clevis ears
var rEar1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.13), mDark);
rEar1.position.set(-1.77, 0.18, 0.12);
pneumGroup.add(rEar1);
var rEar2 = rEar1.clone();
rEar2.position.z = -0.12;
pneumGroup.add(rEar2);

// Air ports (brass fittings)
var pAirX = [0.8, -0.8];
for (var pAi = 0; pAi < 2; pAi++) {
  var pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.2, 8), mBrass);
  pBody.position.set(pAirX[pAi], 0.268, 0);
  pneumGroup.add(pBody);
  var pHead = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.06, 6), mBrass);
  pHead.position.set(pAirX[pAi], 0.41, 0);
  pneumGroup.add(pHead);
  var pHex = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.045, 6), mDark);
  pHex.position.set(pAirX[pAi], 0.365, 0);
  pneumGroup.add(pHex);
}

// PISTON ROD (animated — extends from front cap)
var pistonRod = new THREE.Mesh(new THREE.CylinderGeometry(0.074, 0.074, 2.2, 24), mSteel);
pistonRod.rotation.z = Math.PI / 2;
pneumGroup.add(pistonRod);

// Rod end (clevis-style mount)
var rodEndGrp = new THREE.Group();
var reBody = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.26, 0.1), mDark);
rodEndGrp.add(reBody);
var reEye = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.02, 8, 16), mBolt);
reEye.rotation.x = Math.PI / 2;
reEye.position.y = 0.12;
rodEndGrp.add(reEye);
var rePin = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.16, 10), mSteel);
rePin.position.y = 0.12;
rodEndGrp.add(rePin);
pneumGroup.add(rodEndGrp);

// Rail system + carriage
var pRails = buildRailSystem(4.6);
pRails.position.set(0, -0.42, 0);
pneumGroup.add(pRails);

var pCarriage = buildCarriage();
pCarriage.position.set(0, -0.30, 0);
pneumGroup.add(pCarriage);

cr(pneumGroup);
scene.add(pneumGroup);

/* =====================================================
   MODEL 2: BALL SCREW DRIVE
===================================================== */
var bsGroup = new THREE.Group();
bsGroup.visible = false;
var BS_LEN = 4.2;

// SCREW GROUP (rotates as unit around X)
var screwGroup = new THREE.Group();

var bsShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, BS_LEN, 24), mSteel);
bsShaft.rotation.z = Math.PI / 2;
screwGroup.add(bsShaft);

// Thread helix: staggered partial-torus rings
var N_THREADS = 52;
for (var ti = 0; ti < N_THREADS; ti++) {
  var tf = ti / N_THREADS;
  var tx = -BS_LEN / 2 + tf * BS_LEN;
  var ta = tf * Math.PI * 2 * 20;
  var tr2 = new THREE.Mesh(
    new THREE.TorusGeometry(0.084, 0.0095, 5, 14, Math.PI * 0.52),
    mAlum
  );
  tr2.position.x = tx;
  tr2.rotation.y = Math.PI / 2; // ring faces along X (perpendicular to shaft)
  tr2.rotation.x = ta;           // helix stagger
  screwGroup.add(tr2);
}

bsGroup.add(screwGroup);

// NUT HOUSING (slides along X)
var bsNutGrp = new THREE.Group();

var nutBody = new THREE.Mesh(new THREE.CylinderGeometry(0.225, 0.225, 0.68, 8), mDark);
nutBody.rotation.z = Math.PI / 2;
bsNutGrp.add(nutBody);

// Flanges at each end of nut
var flXArr = [-0.40, 0.40];
for (var fli = 0; fli < 2; fli++) {
  var flange = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.31, 0.07, 8), mAlum);
  flange.rotation.z = Math.PI / 2;
  flange.position.x = flXArr[fli];
  bsNutGrp.add(flange);
  // Flange bolts (horizontal, along X)
  var fbAngles = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
  for (var fbi = 0; fbi < 4; fbi++) {
    var fba = fbAngles[fbi];
    var fbb = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.38, 6), mBolt);
    fbb.rotation.z = Math.PI / 2;
    fbb.position.set(0, Math.cos(fba) * 0.25, Math.sin(fba) * 0.25);
    bsNutGrp.add(fbb);
  }
}

// Ball return tubes (brass)
var btZ = [-0.11, 0.11];
for (var bti = 0; bti < 2; bti++) {
  var bTube = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.72, 8), mBrass);
  bTube.rotation.z = Math.PI / 2;
  bTube.position.set(0, 0.25, btZ[bti]);
  bsNutGrp.add(bTube);
  var btFitX = [-0.37, 0.37];
  for (var btfi = 0; btfi < 2; btfi++) {
    var btFit = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.05, 8), mBrass);
    btFit.rotation.z = Math.PI / 2;
    btFit.position.set(btFitX[btfi], 0.25, btZ[bti]);
    bsNutGrp.add(btFit);
  }
}

bsGroup.add(bsNutGrp);

// BEARING BLOCKS (both ends)
var bsBrgX = [-BS_LEN / 2 + 0.2, BS_LEN / 2 - 0.2];
for (var bhi = 0; bhi < 2; bhi++) {
  var bhx = bsBrgX[bhi];
  var bHousing = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.44, 0.44), mDark);
  bHousing.position.x = bhx;
  bsGroup.add(bHousing);

  var bRace = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.046, 8, 22),
    mkMat(0x888870, 0.86, 0.16));

// PINION GEAR (custom ExtrudeGeometry)
function buildGear(nT, rIn, rOut, depth) {
  var shape = new THREE.Shape();
  var tw = (Math.PI / nT) * 0.40;
  shape.moveTo(Math.cos(-tw) * rIn, Math.sin(-tw) * rIn);
  for (var i = 0; i < nT; i++) {
    var a0 = (i / nT) * Math.PI * 2;
    var a1 = ((i + 1) / nT) * Math.PI * 2;
    shape.lineTo(Math.cos(a0 - tw) * rIn,        Math.sin(a0 - tw) * rIn);
    shape.lineTo(Math.cos(a0 - tw * 0.5) * rOut, Math.sin(a0 - tw * 0.5) * rOut);
    shape.lineTo(Math.cos(a0 + tw * 0.5) * rOut, Math.sin(a0 + tw * 0.5) * rOut);
    shape.lineTo(Math.cos(a1 - tw) * rIn,        Math.sin(a1 - tw) * rIn);
  }
  shape.closePath();

  // Central hub hole
  var hub = new THREE.Path();
  hub.absarc(0, 0, rIn * 0.45, 0, Math.PI * 2, true);
  shape.holes.push(hub);

  // Lightening holes
  for (var h = 0; h < 5; h++) {
    var ha = (h / 5) * Math.PI * 2;
    var lh = new THREE.Path();
    lh.absarc(Math.cos(ha) * rIn * 0.73, Math.sin(ha) * rIn * 0.73, rIn * 0.13, 0, Math.PI * 2, true);
    shape.holes.push(lh);
  }

  return new THREE.ExtrudeGeometry(shape, {
    depth: depth,
    bevelEnabled: true,
    bevelThickness: 0.011,
    bevelSize: 0.008,
    bevelSegments: 1
  });
}

/* =====================================================
   UI LOGIC
===================================================== */
var currentType = 0;
var loadKg = 100, speedMms = 100, strokeMm = 300;
var allGroups = [pneumGroup, bsGroup, rpGroup];

var typeSpecs = [
  { name: 'Pneumatic',    eff: 72, prec: 0.50, costBase: 3.4, maxSpd: 800, desc: 'Pneumatic — optimal for high-speed, light-load cycles' },
  { name: 'Ball Screw',   eff: 92, prec: 0.02, costBase: 7.8, maxSpd: 280, desc: 'Ball Screw — maximum precision & repeatability' },
  { name: 'Rack & Pinion',eff: 85, prec: 0.08, costBase: 5.0, maxSpd: 600, desc: 'Rack & Pinion — ideal for long-stroke, high-load applications' }
];

function computeAndUpdate() {
  var sp = typeSpecs[currentType];
  var force = Math.round(loadKg * 9.81);
  var eff   = Math.max(48, Math.round(sp.eff - (speedMms / sp.maxSpd) * 12 - (loadKg / 500) * 8));
  var cost  = Math.min(10, sp.costBase + (strokeMm / 1000) * 2.1 + (loadKg / 500) * 1.8).toFixed(1);

  document.getElementById('mf').textContent  = force;
  document.getElementById('me').textContent  = eff;
  document.getElementById('mp').textContent  = sp.prec;
  document.getElementById('mc2').textContent = cost;

  var scores = typeSpecs.map(function(s, i) {
    var sc = s.eff * 0.22;
    if (speedMms <= s.maxSpd * 0.8) sc += 20;
    if (loadKg < 140 && i === 0) sc += 18;
    if (strokeMm > 600 && i === 2) sc += 24;
    if (speedMms < 75 && loadKg > 160 && i === 1) sc += 26;
    sc -= s.costBase * 1.6;
    return sc;
  });
  var best = scores.indexOf(Math.max.apply(null, scores));
  document.getElementById('rec').textContent = typeSpecs[best].desc;
}

function setType(t) {
  currentType = t;
  for (var i = 0; i < allGroups.length; i++) { allGroups[i].visible = (i === t); }
  var tabs = document.querySelectorAll('.tab');
  for (var j = 0; j < tabs.length; j++) { tabs[j].classList.toggle('active', j === t); }
  computeAndUpdate();
}

document.getElementById('sl-load').addEventListener('input', function(e) {
  loadKg = parseInt(e.target.value);
  document.getElementById('lv').textContent = loadKg;
  computeAndUpdate();
});
document.getElementById('sl-speed').addEventListener('input', function(e) {
  speedMms = parseInt(e.target.value);
  document.getElementById('sv').textContent = speedMms;
  computeAndUpdate();
});
document.getElementById('sl-stroke').addEventListener('input', function(e) {
  strokeMm = parseInt(e.target.value);
  document.getElementById('stv').textContent = strokeMm;
  computeAndUpdate();
});

computeAndUpdate();

/* =====================================================
   RESIZE
===================================================== */
function onResize() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
if (window.ResizeObserver) { new ResizeObserver(onResize).observe(document.body); }
onResize();

/* =====================================================
   ANIMATION LOOP
===================================================== */
var lastMs = 0, totalSec = 0;

function animate(now) {
  requestAnimationFrame(animate);

  var dt = Math.min((now - lastMs) * 0.001, 0.05);
  lastMs = now;
  totalSec += dt;

  // Slow auto-spin when not dragging
  if (!dragging) {
    sph.theta += dt * 0.08;
    updateCam();
  }

  var s01 = (Math.sin(totalSec * 0.62) + 1) * 0.5; // 0..1 stroke phase

  // --- PNEUMATIC ---
  if (pneumGroup.visible) {
    var ext = s01 * 1.55;
    // Rod: CylinderGeometry(r,r,2.2), rotation.z=PI/2 → axis is X
    // Keep left end (toward barrel) fixed. Left end = position.x - length*scale.x/2
    // Left end should stay at ~1.65 (front of barrel)
    var rodLen = 2.2;
    var rodScale = 1.0 + ext * 0.48;
    pistonRod.scale.x = rodScale;
    pistonRod.position.x = 1.65 + (rodLen * rodScale) / 2;
    rodEndGrp.position.x = 1.65 + rodLen * rodScale + 0.07;
    pCarriage.position.x = ext * 0.45;
  }

  // --- BALL SCREW ---
  if (bsGroup.visible) {
    screwGroup.rotation.x = totalSec * 2.6;
    var nutPos = (s01 - 0.5) * 2.8;
    bsNutGrp.position.x = nutPos;
    bsCarriage.position.x = nutPos;
  }

  // --- RACK & PINION ---
  if (rpGroup.visible) {
    var rPos = (s01 - 0.5) * 3.4;
    rackGrp.position.x  = rPos;
    rpCarriage.position.x = rPos;
    var pitchRadius = 0.235;
    pinionMesh.rotation.z = -rPos / pitchRadius;
  }

  renderer.render(scene, camera);
}

updateCam();
animate(0);
