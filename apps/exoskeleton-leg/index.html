<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exoskeleton Lower Limb Configurator — YOUBIONIC</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
canvas { display: block; width: 100vw; height: 100vh; }

#ui {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10,10,10,0.90);
  border-top: 1px solid rgba(237,235,231,0.12);
  padding: 12px 20px 14px;
  backdrop-filter: blur(12px);
}
.ui-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.brand {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: #EDEBE7;
  text-transform: uppercase;
}
.modes { display: flex; gap: 8px; }
.mode-btn {
  padding: 4px 13px;
  border: 1px solid rgba(237,235,231,0.25);
  background: transparent;
  color: rgba(237,235,231,0.5);
  font-size: 9px;
  letter-spacing: 0.12em;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
  font-family: inherit;
}
.mode-btn.active {
  border-color: #EDEBE7;
  color: #EDEBE7;
  background: rgba(237,235,231,0.07);
}
.sliders {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px 24px;
}
.slider-group label {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  letter-spacing: 0.10em;
  color: rgba(237,235,231,0.65);
  margin-bottom: 5px;
  text-transform: uppercase;
}
.slider-group input[type=range] {
  width: 100%;
  -webkit-appearance: none;
  height: 1px;
  background: rgba(237,235,231,0.18);
  outline: none;
  cursor: pointer;
}
.slider-group input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px; height: 11px;
  background: #EDEBE7;
  border-radius: 50%;
}
.info-bar {
  display: flex;
  justify-content: space-between;
  margin-top: 9px;
  padding-top: 7px;
  border-top: 1px solid rgba(237,235,231,0.07);
}
.info-bar span { font-size: 9px; letter-spacing: 0.07em; color: rgba(237,235,231,0.38); }
#torque-display { color: rgba(237,235,231,0.55); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="ui-top">
    <span class="brand">YOUBIONIC &mdash; Exoskeleton Lower Limb Configurator</span>
    <div class="modes">
      <button class="mode-btn active" data-mode="rehab">Rehab</button>
      <button class="mode-btn" data-mode="support">Support</button>
      <button class="mode-btn" data-mode="analysis">Analysis</button>
    </div>
  </div>
  <div class="sliders">
    <div class="slider-group">
      <label><span>Hip Flexion</span><span id="hip-val">20&deg;</span></label>
      <input type="range" id="hip-slider" min="-15" max="90" value="20">
    </div>
    <div class="slider-group">
      <label><span>Knee Flexion</span><span id="knee-val">35&deg;</span></label>
      <input type="range" id="knee-slider" min="0" max="120" value="35">
    </div>
    <div class="slider-group">
      <label><span>Ankle Dorsiflexion</span><span id="ankle-val">5&deg;</span></label>
      <input type="range" id="ankle-slider" min="-30" max="30" value="5">
    </div>
  </div>
  <div class="info-bar">
    <span>Drag to rotate &middot; Scroll to zoom</span>
    <span id="torque-display">Hip: &mdash; &middot; Knee: &mdash; &middot; Ankle: &mdash;</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ─── RENDERER ─────────────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputEncoding = THREE.sRGBEncoding;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

var camera = new THREE.PerspectiveCamera(46, 1, 0.1, 80);

// ─── ENV MAP ──────────────────────────────────────────────────────────────
function buildEnvMap() {
  var pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  var ec = document.createElement('canvas');
  ec.width = 512; ec.height = 256;
  var ctx = ec.getContext('2d');
  var g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#2a2a38');
  g.addColorStop(0.5, '#14141c');
  g.addColorStop(1, '#08080e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 256);
  ctx.fillStyle = 'rgba(180,200,230,0.30)';
  ctx.beginPath(); ctx.ellipse(90, 70, 90, 65, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(80,100,160,0.14)';
  ctx.beginPath(); ctx.ellipse(390, 170, 65, 55, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(240,240,220,0.06)';
  ctx.beginPath(); ctx.ellipse(250, 250, 200, 40, 0, 0, Math.PI * 2); ctx.fill();
  var tex = new THREE.CanvasTexture(ec);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  var env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
  return env;
}
var envMap = buildEnvMap();
scene.environment = envMap;

// ─── LIGHTS ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xc8d4e8, 0.32));

var keyLight = new THREE.DirectionalLight(0xffffff, 1.9);
keyLight.position.set(6, 10, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 35;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
keyLight.shadow.bias = -0.001;
scene.add(keyLight);

var fillLight = new THREE.DirectionalLight(0x7090b8, 0.55);
fillLight.position.set(-5, 3, -4);
scene.add(fillLight);

var rimLight = new THREE.DirectionalLight(0xEDEBE7, 0.38);
rimLight.position.set(1, -5, -5);
scene.add(rimLight);

// ─── MATERIALS ────────────────────────────────────────────────────────────
var skinMat = new THREE.MeshStandardMaterial({
  color: 0xc8956a,
  roughness: 0.78,
  metalness: 0.02,
  envMap: envMap,
  envMapIntensity: 0.25
});

var carbonMat = new THREE.MeshStandardMaterial({
  color: 0x181820,
  roughness: 0.22,
  metalness: 0.60,
  envMap: envMap,
  envMapIntensity: 1.3
});

var actuatorMat = new THREE.MeshStandardMaterial({
  color: 0xb4bcc8,
  roughness: 0.10,
  metalness: 0.94,
  envMap: envMap,
  envMapIntensity: 1.6
});

var cuffMat = new THREE.MeshStandardMaterial({
  color: 0x252532,
  roughness: 0.42,
  metalness: 0.28,
  envMap: envMap,
  envMapIntensity: 0.9
});

var boltMat = new THREE.MeshStandardMaterial({
  color: 0x7888a0,
  roughness: 0.14,
  metalness: 0.96,
  envMap: envMap,
  envMapIntensity: 1.5
});

// ─── HELPERS ──────────────────────────────────────────────────────────────
function latheMesh(pts, segs, mat) {
  var vecs = [];
  for (var i = 0; i < pts.length; i++) {
    vecs.push(new THREE.Vector2(pts[i][0], pts[i][1]));
  }
  var geo = new THREE.LatheGeometry(vecs, segs || 20);
  var m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// Compound actuator (axis along local X)
function buildActuator(bodyR, bodyH, flangeR, nBolts) {
  var grp = new THREE.Group();
  // Main body
  var cyl = new THREE.CylinderGeometry(bodyR, bodyR, bodyH, 24, 1);
  var body = new THREE.Mesh(cyl, actuatorMat);
  body.rotation.z = Math.PI / 2;
  body.castShadow = true;
  grp.add(body);
  // Center band
  var band = new THREE.Mesh(
    new THREE.CylinderGeometry(bodyR + 0.018, bodyR + 0.018, bodyH * 0.22, 24),
    boltMat
  );
  band.rotation.z = Math.PI / 2;
  band.castShadow = true;
  grp.add(band);
  // Flanges and bolts at each end
  var ends = [-bodyH * 0.5, bodyH * 0.5];
  for (var ei = 0; ei < ends.length; ei++) {
    var xOff = ends[ei];
    var flange = new THREE.Mesh(
      new THREE.CylinderGeometry(flangeR, flangeR, 0.038, 20),
      actuatorMat
    );
    flange.rotation.z = Math.PI / 2;
    flange.position.x = xOff;
    flange.castShadow = true;
    grp.add(flange);
    for (var bi = 0; bi < nBolts; bi++) {
      var ang = (bi / nBolts) * Math.PI * 2;
      var bolt = new THREE.Mesh(
        new THREE.CylinderGeometry(0.016, 0.016, 0.052, 6),
        boltMat
      );
      bolt.rotation.z = Math.PI / 2;
      bolt.position.set(xOff, Math.sin(ang) * flangeR * 0.72, Math.cos(ang) * flangeR * 0.72);
      grp.add(bolt);
    }
  }
  return grp;
}

// Tube rail along local Y, offset in X and Z
function buildRail(y0, y1, xOff, zOff) {
  var mid = (y0 + y1) * 0.5;
  var curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(xOff, y0, zOff),
    new THREE.Vector3(xOff * 0.92, mid, zOff),
    new THREE.Vector3(xOff, y1, zOff)
  ]);
  var geo = new THREE.TubeGeometry(curve, 14, 0.026, 8, false);
  var m = new THREE.Mesh(geo, carbonMat);
  m.castShadow = true;
  return m;
}

// Cross strut
function buildStrut(y, x0, x1, zOff) {
  var curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(x0, y, zOff),
    new THREE.Vector3(0, y, zOff * 1.08),
    new THREE.Vector3(x1, y, zOff)
  ]);
  var geo = new THREE.TubeGeometry(curve, 8, 0.020, 7, false);
  var m = new THREE.Mesh(geo, carbonMat);
  m.castShadow = true;
  return m;
}

// Cuff arc (open torus)
function buildCuff(radius, y) {
  var geo = new THREE.TorusGeometry(radius, 0.036, 7, 26, Math.PI * 1.6);
  var m = new THREE.Mesh(geo, cuffMat);
  m.position.y = y;
  m.rotation.x = Math.PI / 2;
  m.rotation.z = -0.8;
  m.castShadow = true;
  return m;
}

// Force arrow (pointing up from origin)
function buildArrow(length, col) {
  var grp = new THREE.Group();
  var mat = new THREE.MeshStandardMaterial({
    color: col,
    roughness: 0.55,
    metalness: 0.10,
    envMap: envMap,
    envMapIntensity: 0.5,
    transparent: true,
    opacity: 0.88
  });
  var shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.022, 0.022, length * 0.72, 8),
    mat
  );
  shaft.position.y = length * 0.36;
  grp.add(shaft);
  var head = new THREE.Mesh(
    new THREE.ConeGeometry(0.058, length * 0.28, 8),
    mat
  );
  head.position.y = length * 0.86;
  grp.add(head);
  grp.visible = false;
  return grp;
}

// ─── SCENE GRAPH ──────────────────────────────────────────────────────────
// Anatomical proportions (adult leg, normalized):
// Hip to knee: 2.90 units (femur ~45cm in life)
// Knee to ankle: 2.60 units (tibia ~40cm in life)
// Ankle to ground: 0.70 units
// Scale: 1 unit ≈ 15-16 cm

var legRoot = new THREE.Group();
scene.add(legRoot);

// ── HIP GROUP (pivot at hip joint, world y=2.60) ──
var hipGroup = new THREE.Group();
hipGroup.position.y = 2.60;
legRoot.add(hipGroup);

// Thigh skin — LatheGeometry profile [radius, y]
// y runs from 0 (hip) to -2.90 (knee)
// Real thigh: wider at upper/mid, narrowing at knee, slight flare at condyles
var thighMesh = latheMesh([
  [0.01,  0.00],
  [0.22,  -0.08],
  [0.24,  -0.45],
  [0.23,  -1.00],
  [0.21,  -1.70],
  [0.19,  -2.30],
  [0.17,  -2.68],
  [0.19,  -2.90]
], 22, skinMat);
hipGroup.add(thighMesh);

// Hip actuator (at y=0)
var hipAct = buildActuator(0.135, 0.52, 0.175, 6);
hipAct.position.y = 0.02;
hipGroup.add(hipAct);

// Exo thigh rails: two lateral + one posterior
hipGroup.add(buildRail(0, -2.90,  0.27,  0.08));
hipGroup.add(buildRail(0, -2.90, -0.27,  0.08));
hipGroup.add(buildRail(0, -2.90,  0.00, -0.27));

// Struts
hipGroup.add(buildStrut(-0.70,  0.27, -0.27,  0.08));
hipGroup.add(buildStrut(-1.80,  0.27, -0.27,  0.08));
hipGroup.add(buildStrut(-2.60,  0.27, -0.27,  0.08));

// Cuffs on thigh
hipGroup.add(buildCuff(0.295, -0.80));
hipGroup.add(buildCuff(0.255, -2.00));

// ── KNEE GROUP (pivot at knee, y=-2.90 relative to hipGroup) ──
var kneeGroup = new THREE.Group();
kneeGroup.position.y = -2.90;
hipGroup.add(kneeGroup);

// Shin skin
var shinMesh = latheMesh([
  [0.01,  0.00],
  [0.19,  -0.04],
  [0.20,  -0.38],  // calf bulge
  [0.19,  -0.85],
  [0.16,  -1.50],
  [0.12,  -2.10],
  [0.09,  -2.48],
  [0.08,  -2.60]
], 20, skinMat);
kneeGroup.add(shinMesh);

// Knee actuator
var kneeAct = buildActuator(0.155, 0.58, 0.195, 6);
kneeAct.position.y = 0.04;
kneeGroup.add(kneeAct);

// Shin rails: two lateral + one anterior
kneeGroup.add(buildRail(0, -2.60,  0.23,  0.10));
kneeGroup.add(buildRail(0, -2.60, -0.23,  0.10));
kneeGroup.add(buildRail(0, -2.60,  0.00,  0.24));

// Shin struts
kneeGroup.add(buildStrut(-0.75,  0.23, -0.23,  0.10));
kneeGroup.add(buildStrut(-1.80,  0.23, -0.23,  0.10));

// Shin cuffs
kneeGroup.add(buildCuff(0.235, -0.80));
kneeGroup.add(buildCuff(0.155, -2.10));

// ── ANKLE GROUP (y=-2.60 relative to kneeGroup) ──
var ankleGroup = new THREE.Group();
ankleGroup.position.y = -2.60;
kneeGroup.add(ankleGroup);

// Ankle actuator
var ankleAct = buildActuator(0.098, 0.44, 0.130, 5);
ankleAct.position.y = -0.04;
ankleGroup.add(ankleAct);

// Foot: compound from heel sphere + body cylinder + toe sphere (not naked: combined compound)
// Entire foot assembly in ankle-local space
// Foot lies along Z (forward), drops in Y

// Foot body — flattened cylinder lying along Z
var footBodyGeo = new THREE.CylinderGeometry(0.095, 0.110, 0.82, 18);
var footBody = new THREE.Mesh(footBodyGeo, skinMat);
footBody.castShadow = true;
footBody.receiveShadow = true;
// Rotate so cylinder axis runs along Z (forward), then flatten vertically
footBody.rotation.x = Math.PI / 2;
footBody.scale.y = 0.52;  // flatten to foot height
footBody.position.set(0.005, -0.19, 0.38);
ankleGroup.add(footBody);

// Heel — scaled sphere giving organic heel shape
var heelGeo = new THREE.SphereGeometry(0.115, 14, 9);
var heelMesh = new THREE.Mesh(heelGeo, skinMat);
heelMesh.castShadow = true;
heelMesh.scale.set(0.92, 0.70, 0.85);
heelMesh.position.set(0.005, -0.21, -0.08);
ankleGroup.add(heelMesh);

// Toe area — slightly wider, lower
var toeGeo = new THREE.SphereGeometry(0.115, 14, 9);
var toeMesh = new THREE.Mesh(toeGeo, skinMat);
toeMesh.castShadow = true;
toeMesh.scale.set(1.05, 0.55, 0.80);
toeMesh.position.set(0.005, -0.22, 0.77);
ankleGroup.add(toeMesh);

// Ankle exo rails down to foot
ankleGroup.add(buildRail(0, -0.55,  0.20, 0.06));
ankleGroup.add(buildRail(0, -0.55, -0.20, 0.06));

// ─── FORCE ARROWS (attached to joint groups, shown only in analysis mode) ──
var hipArrow   = buildArrow(0.85, 0xff3030);
hipArrow.position.set(0.55, 0, 0);
hipGroup.add(hipArrow);

var kneeArrow  = buildArrow(0.75, 0xff7020);
kneeArrow.position.set(0.50, 0, 0);
kneeGroup.add(kneeArrow);

var ankleArrow = buildArrow(0.55, 0xffcc00);
ankleArrow.position.set(0.45, -0.10, 0);
ankleGroup.add(ankleArrow);

// ─── ORBIT CONTROLS ───────────────────────────────────────────────────────
var sph = { theta: 0.45, phi: 1.18, radius: 10.5 };
var tgt = new THREE.Vector3(0.0, -0.60, 0.0);
var dragging = false;
var prevX = 0, prevY = 0;

function updateCam() {
  camera.position.set(
    tgt.x + sph.radius * Math.sin(sph.phi) * Math.sin(sph.theta),
    tgt.y + sph.radius * Math.cos(sph.phi),
    tgt.z + sph.radius * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  camera.lookAt(tgt);
}
updateCam();

canvas.addEventListener('mousedown', function(e) {
  dragging = true; prevX = e.clientX; prevY = e.clientY;
});
window.addEventListener('mouseup', function() { dragging = false; });
window.addEventListener('mousemove', function(e) {
  if (!dragging) return;
  sph.theta -= (e.clientX - prevX) * 0.007;
  sph.phi = Math.max(0.12, Math.min(Math.PI - 0.12, sph.phi + (e.clientY - prevY) * 0.007));
  prevX = e.clientX; prevY = e.clientY;
  updateCam();
});
canvas.addEventListener('wheel', function(e) {
  sph.radius = Math.max(3.5, Math.min(22, sph.radius + e.deltaY * 0.012));
  updateCam();
}, { passive: true });

// Touch
var tPrev = null;
canvas.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) {
    dragging = true;
    tPrev = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    dragging = false;
    tPrev = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) };
  }
}, { passive: true });
canvas.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1 && dragging && tPrev && tPrev.x !== undefined) {
    sph.theta -= (e.touches[0].clientX - tPrev.x) * 0.009;
    sph.phi = Math.max(0.12, Math.min(Math.PI - 0.12, sph.phi + (e.touches[0].clientY - tPrev.y) * 0.009));
    tPrev = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    updateCam();
  } else if (e.touches.length === 2 && tPrev && tPrev.d !== undefined) {
    var d2 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    sph.radius = Math.max(3.5, Math.min(22, sph.radius - (d2 - tPrev.d) * 0.018));
    tPrev.d = d2;
    updateCam();
  }
}, { passive: true });
canvas.addEventListener('touchend', function() { dragging = false; tPrev = null; }, { passive: true });

// ─── UI ───────────────────────────────────────────────────────────────────
var hipSlider   = document.getElementById('hip-slider');
var kneeSlider  = document.getElementById('knee-slider');
var ankleSlider = document.getElementById('ankle-slider');
var hipValEl    = document.getElementById('hip-val');
var kneeValEl   = document.getElementById('knee-val');
var ankleValEl  = document.getElementById('ankle-val');
var torqueEl    = document.getElementById('torque-display');

var currentMode = 'rehab';

function updateJoints() {
  var hd = parseFloat(hipSlider.value);
  var kd = parseFloat(kneeSlider.value);
  var ad = parseFloat(ankleSlider.value);

  hipValEl.textContent   = hd + '°';
  kneeValEl.textContent  = kd + '°';
  ankleValEl.textContent = ad + '°';

  // Sagittal plane rotations around X axis
  // Hip: positive = hip flexion (thigh forward)
  hipGroup.rotation.x  =  hd * Math.PI / 180;
  // Knee: positive slider = knee flexion (shin backward) → negative rotation
  kneeGroup.rotation.x = -kd * Math.PI / 180;
  // Ankle: positive slider = dorsiflexion (toes up) → negative rotation
  ankleGroup.rotation.x = -ad * Math.PI / 180;

  if (currentMode === 'analysis') {
    var m = 70;  // 70 kg body
    var g = 9.81;
    var hipTq  = Math.round(Math.abs(m * g * 0.44 * Math.sin(hd  * Math.PI / 180)));
    var kneeTq = Math.round(Math.abs(m * g * 0.38 * Math.sin(kd  * Math.PI / 180)));
    var ankleTq= Math.round(Math.abs(m * g * 0.07 * Math.sin(Math.abs(ad) * Math.PI / 180)));
    torqueEl.textContent = 'Hip: ' + hipTq + ' Nm  ·  Knee: ' + kneeTq + ' Nm  ·  Ankle: ' + ankleTq + ' Nm';
    hipArrow.scale.y   = Math.max(0.15, hipTq  / 130);
    kneeArrow.scale.y  = Math.max(0.15, kneeTq / 100);
    ankleArrow.scale.y = Math.max(0.15, ankleTq / 25);
  } else {
    torqueEl.textContent = 'Hip: —  ·  Knee: —  ·  Ankle: —';
  }
}

hipSlider.addEventListener('input', updateJoints);
kneeSlider.addEventListener('input', updateJoints);
ankleSlider.addEventListener('input', updateJoints);

document.querySelectorAll('.mode-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentMode = btn.dataset.mode;

    var showArrows = (currentMode === 'analysis');
    hipArrow.visible   = showArrows;
    kneeArrow.visible  = showArrows;
    ankleArrow.visible = showArrows;

    if (currentMode === 'support') {
      carbonMat.color.setHex(0x18203a);
      actuatorMat.color.setHex(0x90c4e8);
    } else if (currentMode === 'analysis') {
      carbonMat.color.setHex(0x1e1e2c);
      actuatorMat.color.setHex(0xb4bcc8);
    } else {
      carbonMat.color.setHex(0x181820);
      actuatorMat.color.setHex(0xb4bcc8);
    }
    updateJoints();
  });
});

updateJoints();

// ─── RESIZE ───────────────────────────────────────────────────────────────
function onResize() {
  var w = canvas.clientWidth;
  var h = canvas.clientHeight;
  if (w === 0 || h === 0) { w = window.innerWidth; h = window.innerHeight; }
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(onResize).observe(canvas);
onResize();

// ─── ANIMATE ──────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (!dragging) {
    sph.theta += 0.0025;
    updateCam();
  }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
